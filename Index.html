
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impressor de Seriais - Zebra</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#f1f5f9;font-family:Arial,sans-serif}
main{max-width:900px;margin:30px auto;padding:20px}
h1{font-size:25px}
.card{background:#1e293b;padding:20px;border-radius:12px;margin:15px 0}
label{display:block;margin:12px 0 6px}
input,textarea,select{width:100%;padding:12px;border:1px solid #475569;border-radius:7px;background:#0f172a;color:white;font-size:16px}
textarea{height:130px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{padding:13px 18px;border:0;border-radius:7px;background:#22c55e;color:#052e16;font-weight:bold;cursor:pointer;margin:8px 5px 0 0}
button.secondary{background:#334155;color:white}
#status{margin-top:12px;color:#86efac}
#preview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:15px}
.label{background:white;color:black;aspect-ratio:40/50;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;padding:8px}
.label svg{width:95%;max-height:65%}
.label span{font-size:14px;font-weight:bold;margin-top:6px;overflow-wrap:anywhere;text-align:center}
@media(max-width:500px){main{padding:10px}.row{grid-template-columns:1fr}}
@media print{
@page{size:80mm 50mm;margin:0}
html,body{margin:0;padding:0;background:white}
main{display:none!important}
#printArea{display:block!important}
.sheet{width:80mm;height:50mm;display:grid;grid-template-columns:40mm 40mm;break-after:page;page-break-after:always;overflow:hidden}
.sheet:last-child{break-after:auto;page-break-after:auto}
.sheet .label{width:40mm;height:50mm;aspect-ratio:auto;border:0;padding:2mm}
.sheet .label svg{width:36mm;max-height:29mm}
.sheet .label span{font-size:11pt}
}
#printArea{display:none}
</style>
</head>
<body>
<main>
<h1>Impressor de Seriais Zebra</h1>

<div class="card">
<h2>Gerar sequência</h2>
<div class="row">
<div>
<label>Serial inicial</label>
<input id="inicio" value="100001">
</div>
<div>
<label>Serial final</label>
<input id="fim" value="100100">
</div>
</div>
<button onclick="gerarSequencia()">Gerar sequência</button>
</div>

<div class="card">
<h2>Inserir seriais manualmente</h2>
<label>Cole os seriais, um por linha</label>
<textarea id="manual" placeholder="100001&#10;100002&#10;100003"></textarea>
<button onclick="gerarManual()">Usar lista manual</button>
</div>

<div class="card">
<h2>Configurações</h2>
<label>Quantidade de cópias por serial</label>
<input type="number" id="copias" value="1" min="1" max="100">

<label>Conteúdo da etiqueta</label>
<select id="formato" onchange="atualizar()">
<option value="ambos">Código de barras + número</option>
<option value="barra">Somente código de barras</option>
<option value="numero">Somente número</option>
</select>

<p id="status">Nenhum serial gerado.</p>
<button onclick="imprimir()">Imprimir etiquetas</button>
<button class="secondary" onclick="limpar()">Limpar</button>
</div>

<div class="card">
<h2>Pré-visualização</h2>
<div id="preview"></div>
</div>
</main>

<div id="printArea"></div>

<script>
let seriais=[];

function gerarSequencia(){
 const a=document.getElementById("inicio").value.trim();
 const b=document.getElementById("fim").value.trim();

 if(!/^\d+$/.test(a)||!/^\d+$/.test(b)){
  alert("Digite apenas números.");
  return;
 }

 const inicial=BigInt(a);
 const final=BigInt(b);

 if(final<inicial){
  alert("O serial final deve ser maior que o inicial.");
  return;
 }

 if(final-inicial>9999n){
  alert("Limite de 10.000 seriais por vez.");
  return;
 }

 const tamanho=Math.max(a.length,b.length);
 seriais=[];

 for(let n=inicial;n<=final;n++){
  seriais.push(n.toString().padStart(tamanho,"0"));
 }

 atualizar();
}

function gerarManual(){
 seriais=document.getElementById("manual").value
 .split(/[\n,;\t]+/)
 .map(x=>x.trim())
 .filter(Boolean);

 if(seriais.length>10000){
  alert("Limite de 10.000 seriais.");
  seriais=[];
 }

 atualizar();
}

function copias(){
 return Math.max(1,Math.min(100,Number(
  document.getElementById("copias").value
 )||1));
}

function criarEtiqueta(serial){
 const el=document.createElement("div");
 el.className="label";
 const formato=document.getElementById("formato").value;

 if(formato!=="numero"){
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  el.appendChild(svg);
  try{
   JsBarcode(svg,serial,{
    format:"CODE128",
    displayValue:false,
    margin:0,
    width:1.5,
    height:70
   });
  }catch(e){
   const aviso=document.createElement("span");
   aviso.textContent="Código inválido";
   el.appendChild(aviso);
  }
 }

 if(formato!=="barra"){
  const txt=document.createElement("span");
  txt.textContent=serial;
  el.appendChild(txt);
 }

 return el;
}

function atualizar(){
 const total=seriais.length*copias();
 document.getElementById("status").textContent=
 seriais.length+" seriais | "+total+" etiquetas";

 const preview=document.getElementById("preview");
 preview.replaceChildren();

 const limite=Math.min(seriais.length,20);
 for(let i=0;i<limite;i++){
  preview.appendChild(criarEtiqueta(seriais[i]));
 }

 if(seriais.length>limite){
  const p=document.createElement("p");
  p.textContent="Exibindo os primeiros "+limite+" seriais.";
  preview.appendChild(p);
 }
}

function imprimir(){
 if(!seriais.length){
  alert("Gere os seriais primeiro.");
  return;
 }

 if(typeof JsBarcode==="undefined"){
  alert("A biblioteca de código de barras não carregou. Verifique a internet.");
  return;
 }

 const area=document.getElementById("printArea");
 area.replaceChildren();

 const lista=[];
 for(const serial of seriais){
  for(let i=0;i<copias();i++)lista.push(serial);
 }

 for(let i=0;i<lista.length;i+=2){
  const folha=document.createElement("div");
  folha.className="sheet";
  folha.appendChild(criarEtiqueta(lista[i]));
  if(lista[i+1]){
   folha.appendChild(criarEtiqueta(lista[i+1]));
  }
  area.appendChild(folha);
 }

 setTimeout(()=>window.print(),300);
}

function limpar(){
 seriais=[];
 document.getElementById("manual").value="";
 document.getElementById("preview").replaceChildren();
 document.getElementById("printArea").replaceChildren();
 atualizar();
}

document.getElementById("copias").addEventListener("input",atualizar);
</script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
</body>
</html>
